[package]
name = "dreamwork_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0 OR MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]
# Enables `PRAGMA key = …` before migrations; you must link SQLCipher (not stock SQLite).
sqlcipher = []
# Downloads ONNX Runtime binaries via `ort` (CI-friendly on Linux x86_64 / common targets).
onnx = ["dep:ort", "dep:ndarray"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
rand_core = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }

ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["download-binaries", "ndarray", "tls-rustls"] }
ndarray = { version = "0.17", default-features = true, optional = true }

[dev-dependencies]
tempfile = "3"
