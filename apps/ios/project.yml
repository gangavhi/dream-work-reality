name: DreamWorkApp
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
configs:
  Debug: debug
  Release: release
targets:
  DreamWorkApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: DreamWorkApp/RustCore.xcconfig
      Release: DreamWorkApp/RustCore.xcconfig
    sources:
      - path: DreamWorkApp/Sources
      - path: Vendor/onnxruntime-bindings
        excludes:
          - docs
          - test
          - format_objc.sh
          - ReadMe.md
          - ort_checkpoint.mm
          - ort_checkpoint_internal.h
          - ort_training_session.mm
          - ort_training_session_internal.h
          - include/ort_checkpoint.h
          - include/ort_training_session.h
          - include/onnxruntime_training.h
      # Raw .xcassets is not copied into the .app.
      - path: DreamWorkApp/Resources/Assets.xcassets
        buildPhase: none
      # Required for App Store: 120×120 etc. at bundle root (Copy Bundle Resources).
      - path: DreamWorkApp/Resources/BundleAppIcons/AppIcon60x60@2x.png
        buildPhase: resources
      - path: DreamWorkApp/Resources/BundleAppIcons/AppIcon60x60@3x.png
        buildPhase: resources
      - path: DreamWorkApp/Resources/BundleAppIcons/AppIcon76x76@2x~ipad.png
        buildPhase: resources
      - path: DreamWorkApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: DreamWorkApp/Resources/model-manifest.json
        buildPhase: resources
    preBuildScripts:
      - name: Build Rust Core (iOS)
        script: |
          /bin/sh "${SRCROOT}/DreamWorkApp/Scripts/build_rust_core.sh"
    dependencies:
      - framework: Vendor/onnxruntime.xcframework
        embed: false
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Embed Required Local ML Models
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP="${CODESIGNING_FOLDER_PATH:-${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}}"
          SOURCE_DIR="${DREAMWORK_MODEL_DIR:-${HOME}/Library/Application Support/DreamWork/models}"
          DEST_DIR="${APP}/Models"
          # Only embed the scan-time Qwen model. The storage planner GGUF is deferred off the
          # scan path; bundling both files increases jetsam risk on first launch.
          REQUIRED_MODELS=(
            "Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
          )
          ONNX_MODELS=(
            "minilm_field_embed_int8.onnx"
            "minilm_tokenizer.json"
          )
          if [[ "${CONFIGURATION}" != "Release" || "${PLATFORM_NAME}" != "iphoneos" ]]; then
            echo "Embedding ONNX field mapper for ${CONFIGURATION}/${PLATFORM_NAME}"
            mkdir -p "${DEST_DIR}"
            for model in "${ONNX_MODELS[@]}"; do
              src="${SOURCE_DIR}/${model}"
              if [[ ! -f "${src}" ]]; then
                echo "error: required ONNX field mapper missing: ${src}" >&2
                echo "Run apps/ios/scripts/download-minilm-onnx-model.sh before building." >&2
                exit 1
              fi
              echo "Embedding ONNX artifact ${model}"
              rsync -a "${src}" "${DEST_DIR}/${model}"
            done
            echo "Skipping GGUF model embedding for ${CONFIGURATION}/${PLATFORM_NAME}"
            exit 0
          fi
          if [[ ! -d "${APP}" ]]; then
            echo "error: app bundle not found at ${APP}" >&2
            exit 1
          fi
          mkdir -p "${DEST_DIR}"
          for model in "${REQUIRED_MODELS[@]}"; do
            src="${SOURCE_DIR}/${model}"
            if [[ ! -f "${src}" ]]; then
              echo "error: required local ML model missing: ${src}" >&2
              echo "Run apps/ios/scripts/download-qwen-gguf-model.sh and apps/ios/scripts/download-storage-planner-gguf-model.sh before archiving." >&2
              exit 1
            fi
            echo "Embedding local ML model ${model}"
            rsync -a "${src}" "${DEST_DIR}/${model}"
          done
          for model in "${ONNX_MODELS[@]}"; do
            src="${SOURCE_DIR}/${model}"
            if [[ ! -f "${src}" ]]; then
              echo "error: required ONNX field mapper missing: ${src}" >&2
              echo "Run apps/ios/scripts/download-minilm-onnx-model.sh before archiving." >&2
              exit 1
            fi
            echo "Embedding ONNX artifact ${model}"
            rsync -a "${src}" "${DEST_DIR}/${model}"
          done
      - name: Compile Asset Catalog (AppIcon)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ACTOOL="${DEVELOPER_DIR}/usr/bin/actool"
          ASSETCAT="${SRCROOT}/DreamWorkApp/Resources/Assets.xcassets"
          APP="${CODESIGNING_FOLDER_PATH:-${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}}"
          PART="${DERIVED_FILE_DIR}/assetcatalog_generated_info.plist"
          ICON_PLIST="${SRCROOT}/DreamWorkApp/Resources/CFBundleIcons-loose-pngs.plist"
          MIN_VER="${IPHONEOS_DEPLOYMENT_TARGET:-17.0}"
          mkdir -p "${DERIVED_FILE_DIR}"
          rm -f "${PART}"
          plutil -create xml1 "${PART}"
          if [[ "${PLATFORM_NAME}" != "iphoneos" && "${PLATFORM_NAME}" != "iphonesimulator" ]]; then
            echo "Skipping actool (unsupported PLATFORM_NAME=${PLATFORM_NAME})"
            exit 0
          fi
          if [[ ! -d "${APP}" ]]; then
            echo "error: app bundle not found at ${APP}" >&2
            exit 1
          fi
          "${ACTOOL}" "${ASSETCAT}" --compile "${APP}" \
            --platform "${PLATFORM_NAME}" \
            --minimum-deployment-target "${MIN_VER}" \
            --app-icon AppIcon \
            --enable-on-demand-resources NO \
            --output-partial-info-plist "${PART}"
          # Xcode may pre-create empty CFBundleIcons / CFBundleIcons~ipad in generated Info.plist.
          # PlistBuddy Merge skips duplicate keys, so our CFBundleIconFiles would never apply → App Store 409.
          if [[ -f "${APP}/Info.plist" ]]; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "${APP}/Info.plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad" "${APP}/Info.plist" 2>/dev/null || true
          fi
          # Merge actool partial plist only (includes CFBundleIconName + CFBundleIconFiles). Do not merge
          # CFBundleIcons-loose-pngs.plist first — PlistBuddy skips duplicate CFBundleIcons and drops actool keys.
          if [[ -f "${PART}" && -f "${APP}/Info.plist" ]]; then
            /usr/libexec/PlistBuddy -c "Merge ${PART} :" "${APP}/Info.plist"
          fi
          if [[ -f "${APP}/Info.plist" ]]; then
            if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:0" "${APP}/Info.plist" >/dev/null 2>&1; then
              echo "error: Info.plist missing CFBundleIcons → CFBundlePrimaryIcon → CFBundleIconFiles (App Store 409)." >&2
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "${APP}/Info.plist" >/dev/null 2>&1; then
              echo "error: Info.plist missing CFBundleIcons → CFBundlePrimaryIcon → CFBundleIconName (App Store 409)." >&2
              exit 1
            fi
          fi
          # App Store / Transporter 409: bundle must contain a literal 120×120 PNG (60pt @2x), not only Assets.car.
          ICON_120="${APP}/AppIcon60x60@2x.png"
          if [[ ! -f "${ICON_120}" ]]; then
            echo "error: ${ICON_120} missing after actool — upload will fail with missing 120×120 icon. Ensure BundleAppIcons is in Copy Bundle Resources and the post-build actool phase runs." >&2
            exit 1
          fi
      - name: Sign Embedded Frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP="${CODESIGNING_FOLDER_PATH:-${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}}"
          if [[ ! -d "${APP}/Frameworks" ]]; then
            exit 0
          fi
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          if [[ -z "${IDENTITY}" || "${IDENTITY}" == "-" ]]; then
            exit 0
          fi
          /bin/sh "${SRCROOT}/scripts/sign-embedded-frameworks.sh" "${APP}" "${IDENTITY}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dream.nestledger.dev
        PRODUCT_NAME: DreamWorkApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: DreamWorkApp/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: DreamWorkApp/Sources/DreamWorkApp-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - SPM_BUILD=1
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/onnxruntime-bindings/include"
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "47"
        INFOPLIST_KEY_CFBundleDisplayName: DreamWork
        INFOPLIST_KEY_NSCameraUsageDescription: Scan driver's licenses, passports, and other documents to extract profile fields on your device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import document photos to extract profile fields on your device.
        # Required for App Store / Transporter when icons live in Assets.car (iOS 11+ SDK).
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        # Universal app + iPad multitasking: Apple rejects empty/missing orientation keys (409).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Custom post-build actool compiles AppIcon; leaving this YES makes Xcode merge
        # assetcatalog_generated_info.plist before our script runs → "Error Opening File" on archive.
        INFOPLIST_ENABLE_CFBUNDLEICONS_MERGE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        # Do not set CODE_SIGN_IDENTITY to Apple Distribution here — it conflicts with Automatic signing
        # ("automatically signed for development, but Apple Distribution was manually specified").
        # Empty lets Xcode pick Development for local runs and Distribution for Release archives / export.
        CODE_SIGN_IDENTITY: ""
    scheme:
      testTargets:
        - DreamWorkAppTests
        - DreamWorkAppUITests

  DreamWorkAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DreamWorkAppTests
    resources:
      - path: DreamWorkAppTests/Fixtures
    dependencies:
      - target: DreamWorkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dream.nestledger.dev.tests
        GENERATE_INFOPLIST_FILE: YES

  DreamWorkAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DreamWorkAppUITests
    dependencies:
      - target: DreamWorkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dream.nestledger.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
