name: DreamWorkApp
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
configs:
  Debug: debug
  Release: release
targets:
  DreamWorkApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: DreamWorkApp/RustCore.xcconfig
      Release: DreamWorkApp/RustCore.xcconfig
    sources:
      - path: DreamWorkApp/Sources
      - path: DreamWorkApp/Resources/Assets.xcassets
        buildPhase: resources
        type: folder
      - path: DreamWorkApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    preBuildScripts:
      - name: Build Rust Core (iOS)
        script: |
          /bin/sh "${SRCROOT}/DreamWorkApp/Scripts/build_rust_core.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dream.nestledger.dev
        PRODUCT_NAME: DreamWorkApp
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: DreamWork
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - DreamWorkAppTests
        - DreamWorkAppUITests

  DreamWorkAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DreamWorkAppTests
    resources:
      - path: DreamWorkAppTests/Fixtures/driver-license-first.jpeg
    dependencies:
      - target: DreamWorkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dream.nestledger.dev.tests
        GENERATE_INFOPLIST_FILE: YES

  DreamWorkAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DreamWorkAppUITests
    dependencies:
      - target: DreamWorkApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dream.nestledger.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
